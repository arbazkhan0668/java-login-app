name: Java Login App CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-test-package:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v6

      - name: Set up JDK 17
        uses: actions/setup-java@v6
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: Run Maven Unit & Security Tests
        run: mvn test

      - name: Package Executable JAR
        run: mvn clean package -DskipTests

      - name: Upload Built JAR Artifact
        uses: actions/upload-artifact@v6
        with:
          name: java-login-app-jar
          path: target/*.jar