name: Java Login App CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  checkout-code-test:
    runs-on: ubuntu-latest
    steps:
      - name: checkout code
        uses: actions/checkout@v6

      - name: run maven test & unit test
        run: mvn test

  build:
    needs: checkout-code-test
    runs-on: ubuntu-latest
    steps:
      - name: action checkout
        uses: actions/checkout@v6
      - name: java jdk-17
        uses: actions/setup-java@v6
        with: 
          java-version: '17'
          distribution: 'temurin'
          cache: maven

      - name: packages jar
        run: mvn clean package -DskipTests

      - name: upload artifact
        uses: actions/upload-artifact@v6
        with:
          name: java-login-app
          path: target/app.jar
  deploy:
    needs: build
    runs-on: ubuntu-latest
    steps: 
      - name: download artifact
        uses: actions/download-artifact@v6
        with: 
          name: java-login-app
          path: .
    
      - name: copy jar to ec2
        uses: appleboy/scp-action@v0.1.7
        with:  
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          source: "*.jar"
          target: "/home/ubuntu/myapp"

      - name: Start Java App on EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USER }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            sudo systemctl restart java-login-app
            systemctl is-active --quiet java-login-app


