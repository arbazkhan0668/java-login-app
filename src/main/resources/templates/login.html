<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign In — Java Auth Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="bg-slate-800 border border-slate-700 rounded-xl shadow-2xl max-w-md w-full p-8 space-y-6">
        <div class="text-center space-y-1">
            <span class="text-xs font-mono uppercase tracking-wider bg-indigo-500/20 text-indigo-300 px-2.5 py-1 rounded">
                Spring Security v6
            </span>
            <h1 class="text-2xl font-bold pt-2">Sign in to Portal</h1>
            <p class="text-slate-400 text-sm">Enter your credentials to access the dashboard</p>
        </div>

        <!-- Error Message -->
        <div th:if="${param.error}" class="bg-red-950/70 border border-red-500/50 text-red-200 text-xs p-3 rounded-lg">
            Invalid username or password. Please try again.
        </div>

        <!-- Logout Message -->
        <div th:if="${param.logout}" class="bg-emerald-950/70 border border-emerald-500/50 text-emerald-200 text-xs p-3 rounded-lg">
            You have been logged out successfully.
        </div>

        <form th:action="@{/login}" method="post" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Username</label>
                <input type="text" name="username" required placeholder="admin"
                       class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm focus:outline-none focus:border-indigo-500" />
            </div>

            <div>
                <label class="block text-xs font-semibold text-slate-300 mb-1">Password</label>
                <input type="password" name="password" required placeholder="••••••••"
                       class="w-full px-3.5 py-2.5 bg-slate-900 border border-slate-700 rounded-lg text-sm focus:outline-none focus:border-indigo-500" />
            </div>

            <button type="submit"
                    class="w-full bg-indigo-600 hover:bg-indigo-500 text-white font-semibold py-2.5 rounded-lg transition text-sm">
                Sign In
            </button>
        </form>

        <div class="bg-slate-900/80 border border-slate-700/70 rounded-lg p-3 text-xs text-slate-400 space-y-1">
            <p class="font-semibold text-slate-300">Demo Credentials:</p>
            <p>Admin: <code class="text-indigo-300">admin</code> / <code class="text-indigo-300">admin123</code></p>
            <p>User: <code class="text-indigo-300">engineer</code> / <code class="text-indigo-300">devops2026</code></p>
        </div>
    </div>

</body>
</html>
