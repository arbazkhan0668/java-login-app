<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dashboard — Java Auth Portal</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-slate-900 text-slate-100 min-h-screen flex flex-col">

    <nav class="bg-slate-800 border-b border-slate-700 px-6 py-4 flex items-center justify-between">
        <div class="font-bold text-lg text-indigo-400">JavaAuth <span class="text-slate-300 text-sm font-normal">Dashboard</span></div>
        <form th:action="@{/logout}" method="post">
            <button type="submit" class="bg-rose-600 hover:bg-rose-500 text-white text-xs font-semibold px-4 py-2 rounded-lg transition">
                Logout
            </button>
        </form>
    </nav>

    <main class="flex-1 max-w-3xl mx-auto w-full p-6 flex items-center justify-center">
        <div class="bg-slate-800 border border-slate-700 rounded-xl p-8 w-full space-y-4 shadow-xl">
            <span class="inline-block bg-emerald-500/20 text-emerald-300 text-xs font-semibold px-3 py-1 rounded-full">
                ● Authenticated Session Active
            </span>
            <h1 class="text-2xl font-bold">Welcome back, <span th:text="${username}" class="text-indigo-400">User</span>!</h1>
            <p class="text-slate-400 text-sm">
                Aapne Spring Security form authentication successfully pass kar liya hai.
            </p>
            <div class="bg-slate-900 border border-slate-700 rounded-lg p-4 text-xs font-mono space-y-1">
                <p><span class="text-slate-400">Assigned Roles:</span> <span th:text="${roles}" class="text-amber-300"></span></p>
                <p><span class="text-slate-400">Health Endpoint:</span> <a href="/health" class="text-indigo-400 underline">/health</a></p>
            </div>
        </div>
    </main>

</body>
</html>
